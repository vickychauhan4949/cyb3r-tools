<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free JSON Formatter & Validator - Cyb3r Tools</title>
<meta name="description" content="Free JSON Formatter for developers. Format, Validate, Minify JSON online. Made by Vicky Chauhan.">
<style>
body{font-family: monospace; background:#0a0a0a; color:#fff; padding:20px; max-width:800px; margin:auto;}
h1{color:#00ff88; text-align:center;}
textarea{width:100%; height:250px; background:#111; color:#0f0; border:1px solid #00ff88; border-radius:8px; padding:15px; font-size:14px;}
.btns{margin:15px 0; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
button{background:#00ff88; color:#000; border:none; padding:12px 20px; border-radius:6px; font-weight:bold; cursor:pointer;}
button:hover{background:#fff;}
#error{color:#ff4444; margin-top:10px; text-align:center;}
#stats{color:#888; text-align:center; margin-top:10px; font-size:13px;}
</style>
</head>
<body>
<h1>{ } JSON Formatter</h1>
<p style="text-align:center; color:#888;">Paste your ugly JSON - Make it beautiful</p>

<textarea id="input" placeholder='Paste here like {"name":"vicky","city":"ahmedabad"}'></textarea>

<div class="btns">
<button onclick="format()">✨ Format / Beautify</button>
<button onclick="minify()">📦 Minify</button>
<button onclick="copyOut()">📋 Copy</button>
<button onclick="clearAll()">🗑️ Clear</button>
</div>

<textarea id="output" placeholder="Formatted JSON will appear here..."></textarea>
<div id="error"></div>
<div id="stats"></div>

<script>
function format(){
  let inp = document.getElementById('input').value;
  let out = document.getElementById('output');
  let err = document.getElementById('error');
  try{
    let obj = JSON.parse(inp);
    out.value = JSON.stringify(obj, null, 2);
    err.textContent = "";
    document.getElementById('stats').textContent = "Valid JSON ✓ | Lines: " + out.value.split('\n').length;
  }catch(e){
    err.textContent = "Error: " + e.message;
  }
}
function minify(){
  try{
    let obj = JSON.parse(document.getElementById('input').value);
    document.getElementById('output').value = JSON.stringify(obj);
    document.getElementById('error').textContent = "";
  }catch(e){ document.getElementById('error').textContent = "Error: " + e.message; }
}
function copyOut(){
  document.getElementById('output').select();
  document.execCommand('copy');
  alert('Copied!');
}
function clearAll(){
  document.getElementById('input').value="";
  document.getElementById('output').value="";
  document.getElementById('error').textContent="";
  document.getElementById('stats').textContent="";
}
</script>
</body>
</html>
