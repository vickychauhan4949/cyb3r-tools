<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Fire Tools - cyb3r.tools</title>
<style>
body{background:#050805;color:#fff;font-family:sans-serif;margin:0}
.header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1aff1a}
.logo{color:#8cff00;font-weight:bold;font-size:22px}
.container{padding:40px 20px;text-align:center}
h1{color:#8cff00;font-size:42px;margin:0 0 10px;text-shadow:0 0 15px #8cff00}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.card{width:300px;background:#0a0f0a;border:1px solid #8cff00;border-radius:12px;padding:20px;text-align:left;box-shadow:0 0 10px #8cff0033}
.card h3{color:#8cff00}
.btn{margin-top:15px;width:100%;padding:12px;background:transparent;border:1px solid #8cff00;color:#8cff00;border-radius:8px;cursor:pointer}
.btn:hover{background:#8cff00;color:#000}
input{width:100%;padding:10px;background:#000;border:1px solid #333;border-radius:8px;color:#8cff00;margin-top:10px;text-align:center}
.result{margin-top:15px;background:#000;border:1px dashed #8cff00;padding:10px;border-radius:8px;color:#fff;min-height:20px}
</style>
</head>
<body>
<div class="header"><div class="logo">cyb3r.tools</div><div>• ONLINE</div></div>
<div class="container">
<h1>Free Fire Tools</h1>
<p>Free utilities for Free Fire players - sensitivity, names, guild logos.</p>
<div class="cards">
<div class="card">
<h3>Sensitivity Finder</h3>
<p>Optimize sensitivity for smooth aim.</p>
<select id="device" style="width:100%;padding:8px;background:#000;color:#fff;border:1px solid #333;border-radius:6px"><option>Low End (2GB RAM)</option><option>Mid Range (4-6GB)</option><option>High End (8GB+)</option></select>
<button class="btn" onclick="findSens()">> Launch Tool -></button>
<div id="sensResult" class="result"></div>
</div>
<div class="card">
<h3>Stylish Name Generator</h3>
<p>Create stylish names.</p>
<input id="nameInput" placeholder="Enter name e.g. vicky" value="vicky">
<button class="btn" onclick="genName()">> Generate Name -></button>
<div id="nameResult" class="result" style="color:#8cff00;font-weight:bold">vickyⁿˢˢ</div>
</div>
<div class="card">
<h3>Guild Logo Maker</h3>
<p>Design guild logos text.</p>
<input id="logoInput" placeholder="Guild Name">
<button class="btn" onclick="makeLogo()">> Create Logo -></button>
<div id="logoResult" class="result" style="font-size:24px"></div>
</div>
</div>
</div>
<script>
function findSens(){
let d=document.getElementById('device').value;
let r=document.getElementById('sensResult');
if(d.includes('Low')) r.innerHTML='General: 95<br>Red Dot: 90<br>2x: 85<br>4x: 75<br>AWM: 50';
else if(d.includes('Mid')) r.innerHTML='General: 90<br>Red Dot: 85<br>2x: 80<br>4x: 70<br>AWM: 55';
else r.innerHTML='General: 85<br>Red Dot: 80<br>2x: 75<br>4x: 65<br>AWM: 60';
}
function genName(){
let n=document.getElementById('nameInput').value || 'vicky';
let styles=[`꧁༒☬${n}☬༒꧂`,`◥꧁${n}꧂◤`,`${n}ⁿˢˢ`,`༺${n}༻`,`ᴹᴿ°${n}°ᴮᴼˢˢ`];
document.getElementById('nameResult').innerHTML=styles[Math.floor(Math.random()*styles.length)];
}
function makeLogo(){
let l=document.getElementById('logoInput').value || 'GUILD';
document.getElementById('logoResult').innerHTML='[ '+l.toUpperCase()+' ] ⚡';
}
</script>
</body>
</html>
