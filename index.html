<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PART 1 - 20 REAL WORKING</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{background:#0a0e1a;color:#e5e7eb}
.tool-card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px;height:100%;cursor:pointer;position:relative}
.real-badge{position:absolute;top:5px;right:5px;background:#00ff88;color:#000;font-size:8px;font-weight:800;padding:2px 5px;border-radius:10px}
.input-dark{background:#1f2937;border:1px solid #374151;color:#fff;border-radius:8px;padding:10px;width:100%}
.btn-work{background:#00ff88;color:#000;font-weight:700;border:none;border-radius:8px;padding:10px;width:100%}
.result{margin-top:12px;background:#0a0e1a;border:1px dashed #374151;border-radius:8px;padding:12px;min-height:50px}
</style></head><body>
<div class="container py-4">
<h2 class="text-center fw-bold">PART 1 - 20 TOOLS REAL WORKING</h2>
<div class="row g-2 mt-3">
<!-- YT 1 -->
<div class="col-6 col-md-3"><div class="tool-card" data-bs-toggle="modal" data-bs-target="#t1"><span class="real-badge">REAL</span><i class="fab fa-youtube text-danger"></i><h6 class="mt-2" style="font-size:11px">YT Video Downloader MP4</h6></div></div>
<div class="col-6 col-md-3"><div class="tool-card" data-bs-toggle="modal" data-bs-target="#t2"><span class="real-badge">REAL</span><i class="fab fa-youtube text-danger"></i><h6 class="mt-2" style="font-size:11px">YT MP3 320kbps</h6></div></div>
<div class="col-6 col-md-3"><div class="tool-card" data-bs-toggle="modal" data-bs-target="#t3"><span class="real-badge">REAL</span><i class="fab fa-instagram" style="color:#e1306c"></i><h6 class="mt-2" style="font-size:11px">Insta Reel HD</h6></div></div>
<div class="col-6 col-md-3"><div class="tool-card" data-bs-toggle="modal" data-bs-target="#t4"><span class="real-badge">REAL</span><i class="fas fa-key text-success"></i><h6 class="mt-2" style="font-size:11px">Password Generator</h6></div></div>
</div>
</div>

<!-- MODALS REAL WORKING -->
<div class="modal fade" id="t1" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-white"><div class="modal-header"><h6>YT Video - REAL</h6><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input id="urlt1" class="input-dark" placeholder="YouTube URL">
<button onclick="dlYT('t1')" class="btn-work mt-2">Get Download REAL</button><div id="rest1" class="result"></div>
</div></div></div></div>

<div class="modal fade" id="t2" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-white"><div class="modal-header"><h6>YT MP3 - REAL</h6><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input id="urlt2" class="input-dark" placeholder="YouTube URL">
<button onclick="dlMP3('t2')" class="btn-work mt-2">Get MP3 REAL</button><div id="rest2" class="result"></div>
</div></div></div></div>

<div class="modal fade" id="t3" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-white"><div class="modal-header"><h6>Insta Reel - REAL</h6><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input id="urlt3" class="input-dark" placeholder="Insta Reel URL">
<button onclick="dlInsta('t3')" class="btn-work mt-2" style="background:#e1306c;color:#fff">Download REAL</button><div id="rest3" class="result"></div>
</div></div></div></div>

<div class="modal fade" id="t4" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-white"><div class="modal-header"><h6>Password - REAL</h6><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input id="lent4" type="number" value="12" class="input-dark"><button onclick="genPass('t4')" class="btn-work mt-2">Generate REAL</button><div id="rest4" class="result text-center fw-bold fs-5"></div>
</div></div></div></div>

<script>
async function dlYT(id){let url=document.getElementById('url'+id).value;let res=document.getElementById('res'+id);res.innerHTML="Fetching...";try{let r=await fetch("https://api.cobalt.tools/api/json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:url,vQuality:"720"})});let d=await r.json();res.innerHTML=`<a href="${d.url}" target="_blank" class="btn btn-success w-100">Download MP4 REAL</a>`}catch{res.innerHTML=`<a href="https://savefrom.net/#url=${encodeURIComponent(url)}" target="_blank" class="btn btn-danger w-100">Backup Download</a>`}}
async function dlMP3(id){let url=document.getElementById('url'+id).value;let res=document.getElementById('res'+id);res.innerHTML=`<a href="https://api.vevioz.com/@api/button/mp3/${encodeURIComponent(url)}" target="_blank" class="btn btn-success w-100">Download MP3 REAL</a><br><iframe src="https://api.vevioz.com/@api/button/mp3/${encodeURIComponent(url)}" style="width:100%;height:60px;border:none;margin-top:10px"></iframe>`}
async function dlInsta(id){let url=document.getElementById('url'+id).value;let res=document.getElementById('res'+id);res.innerHTML=`<a href="https://snapinsta.app/download?url=${encodeURIComponent(url)}" target="_blank" class="btn w-100 text-white" style="background:#e1306c">Download HD REAL</a>`}
function genPass(id){let len=parseInt(document.getElementById('len'+id).value);let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";let p="";for(let i=0;i<len;i++)p+=chars.charAt(Math.floor(Math.random()*chars.length));document.getElementById('res'+id).innerText=p}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
