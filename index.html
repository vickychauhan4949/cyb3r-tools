<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gujarat Cyber Safe - UPI Fraud Check</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px;text-align:center}
h1{color:#20ff7a}
.card{background:#1a1a1a;padding:20px;border-radius:15px;margin-top:20px;border:1px solid #333}
.btn{background:#20ff7a;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;width:100%;margin-top:10px}
textarea,input{width:100%;padding:12px;border-radius:8px;border:none;margin-top:10px;background:#000;color:#fff}
#res{margin-top:15px;white-space:pre-wrap;color:#20ff7a;font-weight:bold}
</style>
</head>
<body>
<h1>🛡️ Gujarat Cyber Safe</h1>
<p>Fake UPI Screenshot Detector - ગુજરાતી</p>

<div class="card">
<h3>UPI Transaction ID / Text Paste Karo</h3>
<textarea id="tin" placeholder="Yaha UPI Screenshot ka text paste karo... jaise: Transaction ID, Rs 5000 received..." style="height:120px"></textarea>
<button class="btn" onclick="checkUPI()">CHECK FRAUD</button>
<div id="res"></div>
</div>

<div class="card">
<h3>20+ Cyber Tools</h3>
<button class="btn" onclick="alert('Jald aayega!')">QR Scanner</button>
<button class="btn" style="background:#fff;margin-top:8px" onclick="alert('Jald aayega!')">Password Generator</button>
</div>

<script>
function checkUPI(){
 let v=document.getElementById("tin").value.toLowerCase();
 let r=document.getElementById("res");
 if(!v){r.innerText="❌ Pehle text likho";return;}
 let fakeWords=["edited","photoshop","demo","fake","test"];
 let isFake = fakeWords.some(w=>v.includes(w)) || v.includes("pending") || v.length < 10;
 if(isFake){
  r.innerHTML="🚨 <span style='color:red'>FAKE LAG RAHA HAI!</span><br>Saavdhan raho, ye edited ho sakta hai. Bank balance check karo.";
 } else {
  r.innerHTML="✅ <span style='color:#20ff7a'>SAFE LAG RAHA HAI</span><br>Par hamesha bank app me balance verify karo.";
 }
}
</script>
</body>
</html>
