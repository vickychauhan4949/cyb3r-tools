<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020b04">
<title>HACKTOOLS 160+ | Free Online Tools</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020a04;--card:#061108;--green:#20ff62;--border:#0d7b31;--text:#f2fff5;--muted:#8ba291}
html{scroll-behavior:smooth}
body{background:linear-gradient(rgba(0,255,80,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,80,.025) 1px,transparent 1px),var(--bg);background-size:32px 32px;color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(0,255,80,.09),transparent 38%)}
.container{width:min(1100px,94%);margin:auto}
header{padding:18px 0 8px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border:2px solid #12c947;border-radius:17px;background:rgba(2,14,5,.9);box-shadow:0 0 18px rgba(0,255,70,.12)}
.live{color:var(--green);font-weight:800}
.live-dot{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;margin-right:7px;box-shadow:0 0 12px var(--green);animation:pulse 1.3s infinite}
.visitors{color:#d7e8db;font-weight:700}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
.activity{margin-top:28px;background:#080d09;border-left:5px solid var(--green);border-radius:10px;padding:14px 17px;color:#c7d3ca;font-size:15px;transition:.3s}
.brand{margin:28px 0 22px;font-size:clamp(35px,8vw,66px);font-weight:900;letter-spacing:-3px;text-shadow:0 0 12px #00ff55,0 0 35px rgba(0,255,70,.5)}
.brand span{color:#fff}
.brand small{color:var(--green);font-size:.55em;letter-spacing:-1px}
.searchbox{position:relative;margin-bottom:20px}
.searchbox input{width:100%;padding:20px 55px 20px 55px;border:2px solid #14d94e;border-radius:18px;outline:none;color:white;background:#040c05;font-size:18px;box-shadow:0 0 18px rgba(0,255,80,.08)}
.searchbox input:focus{box-shadow:0 0 25px rgba(0,255,80,.2)}
.searchicon{position:absolute;left:19px;top:50%;transform:translateY(-50%);font-size:25px}
.clear{position:absolute;right:18px;top:50%;transform:translateY(-50%);cursor:pointer;color:#6f8175;font-size:20px}
.categories{display:flex;gap:10px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:thin}
.categories::-webkit-scrollbar{height:4px}
.categories::-webkit-scrollbar-thumb{background:#176b30}
.cat{flex:0 0 auto;border:1px solid #126e2e;background:#061108;color:#39f86c;padding:13px 19px;border-radius:12px;cursor:pointer;font-weight:700;transition:.2s}
.cat:hover,.cat.active{background:#0a2710;border-color:var(--green);box-shadow:0 0 15px rgba(0,255,70,.15)}
.section{margin-top:28px;padding-top:25px;border-top:1px solid #0c3820}
.section-title{color:var(--green);font-size:27px;margin-bottom:17px}
.section-title:before{content:"▶ ";font-size:16px}
.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.tool{background:linear-gradient(145deg,#071309,#030b04);border:1px solid #0b5d27;border-radius:18px;padding:19px;min-height:190px;display:flex;flex-direction:column;transition:.22s;position:relative;overflow:hidden}
.tool:after{content:"";position:absolute;height:1px;left:-100%;right:100%;bottom:0;background:var(--green);box-shadow:0 0 12px var(--green);transition:.5s}
.tool:hover{transform:translateY(-3px);border-color:#16db4f;box-shadow:0 0 22px rgba(0,255,70,.13)}
.tool:hover:after{left:0;right:0}
.tool-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tool-icon{font-size:29px}
.tool h3{font-size:19px;line-height:1.25;flex:1}
.badge{font-size:10px;padding:4px 7px;border-radius:6px;background:#10391a;color:#55ff7e;font-weight:900}
.tool p{color:var(--muted);margin-top:12px;line-height:1.4;font-size:14px;flex:1}
.open{width:100%;padding:11px;margin-top:15px;border:1px solid #0b8434;border-radius:12px;background:#061509;color:#2dff67;font-size:15px;font-weight:800;cursor:pointer}
.open:hover{background:#0b2c12;box-shadow:0 0 14px rgba(0,255,70,.15)}
.noresult{display:none;text-align:center;padding:45px 10px;color:#819389}
footer{margin-top:50px;border-top:1px solid #0b4020;padding:28px 0;text-align:center;color:#708277}
footer b{color:var(--green)}
@media(max-width:800px){.tool-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.container{width:92%}.topbar{font-size:14px}.brand{font-size:42px;margin-top:25px}.activity{font-size:14px}.tool-grid{grid-template-columns:1fr}.tool{min-height:175px}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="topbar">
    <div class="live"><span class="live-dot"></span>LIVE NOW • <span id="online">12</span> Online</div>
    <div class="visitors">👁️ <span id="visitors">1278</span>+ Visitors</div>
  </div>
  <div class="activity" id="activityBox">💻 <b id="activeToolUsers">3</b> people using <span id="activeCategory">Top Tools</span> right now</div>
  <div class="brand">⚡ HACK<span>TOOLS</span> <small>160+</small></div>
  <div class="searchbox">
    <span class="searchicon">🔎</span>
    <input id="search" type="text" placeholder="Search 160+ tools..." autocomplete="off">
    <span class="clear" onclick="clearSearch()">×</span>
  </div>
  <div class="categories">
    <button class="cat active" data-cat="All">All</button>
    <button class="cat" data-cat="Top">🔥 Top Tools</button>
    <button class="cat" data-cat="Text">Text</button>
    <button class="cat" data-cat="Image">Image</button>
    <button class="cat" data-cat="Developer">Developer</button>
    <button class="cat" data-cat="Calculator">Calculator</button>
    <button class="cat" data-cat="Social">Social</button>
    <button class="cat" data-cat="SEO">SEO</button>
    <button class="cat" data-cat="PDF">PDF</button>
    <button class="cat" data-cat="Web">Web</button>
    <button class="cat" data-cat="Security">Security</button>
  </div>
</header>
<section class="section" id="topSection"><h2 class="section-title">Top Tools</h2><div class="tool-grid" id="topTools"></div></section>
<section class="section"><h2 class="section-title" id="allTitle">All Tools <span id="count"></span></h2><div class="tool-grid" id="tools"></div><div class="noresult" id="noresult">😕 No tools found.<br>Try another search.</div></section>
<footer>⚡ <b>HACKTOOLS 160+</b><br><small>Free • Fast • Browser Tools • No Login Required</small><div style="margin-top:10px;color:#39ff72;font-size:12px;opacity:.8">🛡️ Trusted by <span id="trustCount">1278</span>+ Hackers Worldwide</div></footer>
</div>
<script>
const topTools = [
 {name:"Instagram Reel Downloader",icon:"📸",cat:"Social",badge:"HOT",desc:"Download public Instagram reels quickly."},
 {name:"WhatsApp Status Downloader",icon:"🟢",cat:"Social",badge:"HOT",desc:"Save WhatsApp status media from your device."},
 {name:"QR Code Generator",icon:"▦",cat:"Web",badge:"TOP",desc:"Create QR codes for text, links and contact data."},
 {name:"Password Generator",icon:"🔐",cat:"Security",badge:"TOP",desc:"Generate strong random passwords instantly."},
 {name:"Image Compressor",icon:"🖼️",cat:"Image",badge:"TOP",desc:"Compress images directly in your browser."},
 {name:"Word Counter",icon:"⚡",cat:"Text",badge:"HOT",desc:"Count words, characters, sentences and lines."},
 {name:"Character Counter",icon:"⚡",cat:"Text",badge:"TOP",desc:"Count characters with and without spaces."},
 {name:"JSON Formatter",icon:"{}",cat:"Developer",badge:"HOT",desc:"Format and validate JSON data."},
 {name:"Base64 Encoder / Decoder",icon:"🔣",cat:"Developer",badge:"TOP",desc:"Encode or decode Base64 text."},
 {name:"URL Encoder / Decoder",icon:"🔗",cat:"Developer",badge:"TOP",desc:"Encode and decode URL strings."},
 {name:"UUID Generator",icon:"🆔",cat:"Developer",badge:"NEW",desc:"Generate unique UUID identifiers."},
 {name:"BMI Calculator",icon:"⚖️",cat:"Calculator",badge:"TOP",desc:"Calculate BMI from height and weight."}
];
const names = {
Text:["Text Case Converter","Uppercase Converter","Lowercase Converter","Title Case Converter","Sentence Case Converter","Alternating Case","Reverse Text","Remove Duplicate Lines","Sort Lines","Text Cleaner","Whitespace Remover","Line Counter","Sentence Counter","Paragraph Counter","Reading Time Calculator","Lorem Ipsum Generator","Random Text Generator","Palindrome Checker","Text Diff Checker","Find and Replace","Email Extractor","URL Extractor","Number Extractor","Hashtag Extractor","Keyword Extractor","Slug Generator","Text to Binary","Binary to Text","Text to Morse","Morse to Text","Text to ASCII","ASCII to Text","ROT13 Encoder","ROT13 Decoder","Caesar Cipher","Word Frequency Counter","Character Frequency","Text Repeater","Text Splitter","Text Joiner","Markdown Preview"],
Image:["Image Resizer","Image Cropper","Image Rotator","Image Flipper","Image Converter","JPG to PNG","PNG to JPG","WebP Converter","Image to Base64","Base64 to Image","Image Color Picker","Image Metadata Viewer","Image Blur Tool","Image Grayscale","Image Brightness","Image Contrast","Image Filters","Favicon Generator","Thumbnail Generator","Placeholder Image","SVG Previewer","SVG to PNG","Image Pixel Checker","Image Dimension Checker","Photo Frame Tool"],
Developer:["HTML Formatter","CSS Formatter","JavaScript Formatter","JSON Minifier","HTML Minifier","CSS Minifier","JS Minifier","XML Formatter","SQL Formatter","SQL Minifier","Regex Tester","Regex Generator","JWT Decoder","Hash Generator","MD5 Generator","SHA256 Generator","SHA1 Generator","Timestamp Converter","Unix Timestamp","Color Code Converter","HEX to RGB","RGB to HEX","HSL Converter","HTML Entity Encoder","HTML Entity Decoder","URL Parser","Query String Parser","User Agent Parser","IP Address Parser","HTTP Status Code Lookup","MIME Type Lookup","Port Number Lookup","Cron Generator","Chmod Calculator","Git Command Helper","Gitignore Generator","Nginx Config Helper","Apache Config Helper","Meta Tag Generator","Robots.txt Generator","Sitemap Generator","Open Graph Generator"],
Calculator:["Age Calculator","Percentage Calculator","Discount Calculator","Tip Calculator","Loan Calculator","EMI Calculator","Simple Interest","Compound Interest","GST Calculator","Tax Calculator","Currency Calculator","Unit Converter","Length Converter","Weight Converter","Temperature Converter","Speed Converter","Time Converter","Data Storage Converter","Area Calculator","Volume Calculator","Distance Calculator","Average Calculator","Ratio Calculator","Fraction Calculator","Scientific Calculator"],
Social:["YouTube Thumbnail URL","YouTube Title Generator","YouTube Description Generator","YouTube Tag Generator","Instagram Bio Generator","Instagram Caption Generator","Hashtag Generator","Social Media Text Counter","Twitter/X Character Counter","Facebook Text Formatter","WhatsApp Text Formatter","WhatsApp Link Generator","Telegram Link Generator","YouTube Embed Generator","YouTube Timestamp Generator"],
SEO:["SEO Meta Generator","Meta Description Generator","SEO Title Generator","Keyword Density Checker","Word Density Checker","Robots.txt Generator","Sitemap XML Generator","Canonical URL Generator","Schema Generator","Open Graph Meta Generator","Twitter Card Generator","Slug Generator SEO","SERP Snippet Preview","Keyword Counter","Text Readability Checker"],
PDF:["PDF Page Counter","PDF Text Extractor","PDF Metadata Viewer","PDF to Text","Text to PDF","Image to PDF","PDF Merge Helper","PDF Split Helper","PDF Size Calculator","PDF Filename Generator"],
Web:["QR Code Generator","Barcode Generator","Color Picker","Gradient Generator","CSS Shadow Generator","CSS Border Generator","CSS Button Generator","CSS Glass Generator","CSS Animation Generator","HTML Boilerplate","Landing Page Generator","Email Link Generator","Phone Link Generator","Google Maps Link Generator","WhatsApp Link Generator","Data URI Generator","PWA Manifest Generator","Web App Icon Generator","Viewport Tester","Screen Size Checker","Browser Info","Local Storage Viewer"],
Security:["Password Generator","Strong Password Checker","Random Token Generator","UUID Generator","Hash Generator","MD5 Generator","SHA256 Generator","Base64 Encoder","Base64 Decoder","URL Encoder","URL Decoder","JWT Decoder","IP Privacy Checker","Security Headers Helper","Random Number Generator"]
};
let tools=[];
Object.keys(names).forEach(cat=>{names[cat].forEach((name,i)=>{tools.push({name,cat,icon:cat==="Text"?"📝":cat==="Image"?"🖼️":cat==="Developer"?"💻":cat==="Calculator"?"🧮":cat==="Social"?"📱":cat==="SEO"?"📈":cat==="PDF"?"📄":cat==="Web"?"🌐":"🔐",badge:i<2?"NEW":"",desc:"Fast browser utility"})})});
const used=new Set();tools=tools.filter(t=>{if(used.has(t.name)) return false;used.add(t.name);return true});
function card(t){return `<article class="tool" data-name="${t.name.toLowerCase()}" data-cat="${t.cat}"><div class="tool-top"><span class="tool-icon">${t.icon}</span><h3>${t.name}</h3>${t.badge?`<span class="badge">${t.badge}</span>`:""}</div><p>${t.desc}</p><button class="open" onclick="openTool('${t.name.replace(/'/g,"\\'")}')">OPEN →</button></article>`}
document.getElementById("topTools").innerHTML = topTools.map(card).join("");
document.getElementById("tools").innerHTML = tools.map(card).join("");
document.getElementById("count").textContent = "(" + (tools.length + topTools.length) + "+)";
const search=document.getElementById("search");
search.addEventListener("input",()=>{
  const q=search.value.toLowerCase().trim();
  document.querySelectorAll(".tool").forEach(el=>{
    const match=el.dataset.name.includes(q);
    const catMatch=currentCat==="All"||currentCat==="Top"||el.dataset.cat===currentCat;
    el.style.display=(match && catMatch)?"flex":"none";
  });
  updateEmpty();
});
let currentCat="All";
document.querySelectorAll(".cat").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    currentCat=btn.dataset.cat;
    const q=search.value.toLowerCase().trim();
    document.querySelectorAll(".tool").forEach(el=>{
      let categoryOK=currentCat==="All"||(currentCat==="Top" && el.closest("#topTools"))||el.dataset.cat===currentCat;
      let searchOK=el.dataset.name.includes(q);
      el.style.display=(categoryOK && searchOK)?"flex":"none";
    });
    document.getElementById("activeCategory").textContent=currentCat==="All"?"Top Tools":currentCat+" Tools";
    updateEmpty();
  });
});
function updateEmpty(){let visible=0;document.querySelectorAll(".tool").forEach(x=>{if(x.style.display!=="none") visible++});document.getElementById("noresult").style.display=visible===0?"block":"none"}
function clearSearch(){search.value="";search.dispatchEvent(new Event("input"));search.focus()}
function openTool(name){
  if(name==="Word Counter"){const text=prompt("Text paste karo:");if(text!==null){const words=text.trim()?text.trim().split(/\s+/).length:0;const chars=text.length;alert("Words: "+words+"\nCharacters: "+chars);}return;}
  if(name==="Character Counter"){const text=prompt("Text paste karo:");if(text!==null){alert("Characters: "+text.length);}return;}
  if(name==="Password Generator"){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";let pass="";for(let i=0;i<16;i++){pass+=chars[Math.floor(Math.random()*chars.length)]}alert("Generated Password:\n\n"+pass);return;}
  if(name==="UUID Generator"){const uuid=crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;const v=c==="x"?r:(r&3|8);return v.toString(16)});alert("UUID:\n\n"+uuid);return;}
  alert("⚡ "+name+"\n\nTool interface ready.\nActual functionality can be connected here.");
}
/* === IMPROVED LIVE + TICKER === */
let vCount = parseInt(localStorage.getItem('vCount')||'1278');
function updateCounts(){
  let online=10+Math.floor(Math.random()*18);
  vCount+=Math.floor(Math.random()*2);
  localStorage.setItem('vCount',vCount);
  document.getElementById("online").textContent=online;
  document.getElementById("visitors").textContent=vCount;
  document.getElementById("trustCount").textContent=vCount;
}
setInterval(updateCounts,4000);
updateCounts();
const tickerMsgs=[
  "💻 <b>3</b> people using Image Tools right now",
  "🔥 <b>Rahul</b> used Password Generator 2 min ago",
  "⚡ <b>Priya</b> used Word Counter 5 min ago",
  "🚀 <b>Aman</b> generated QR Code 1 min ago",
  "💻 <b>7</b> tools used in last 10 minutes",
  "🌍 Someone from <b>Mumbai</b> just visited",
  "📸 <b>5</b> people using Instagram Tools right now",
  "🔐 <b>2</b> people generating passwords right now"
];
let t=0;
setInterval(()=>{
  t=(t+1)%tickerMsgs.length;
  document.getElementById("activityBox").innerHTML=tickerMsgs[t];
},3000);
</script>
</body>
</html>
