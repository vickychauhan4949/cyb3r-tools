<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:#020604;color:#d8ffe4;
 font-family:Arial,Helvetica,sans-serif;
 overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;
 background-image:linear-gradient(#00ff6630 1px,transparent 1px),
 linear-gradient(90deg,#00ff6630 1px,transparent 1px);
 background-size:35px 35px
}
header{
 position:sticky;top:0;z-index:20;
 background:#020604eF;border-bottom:1px solid #00ff6650;
 backdrop-filter:blur(14px)
}
.top{
 max-width:1250px;margin:auto;padding:16px;
 display:flex;align-items:center;gap:15px;justify-content:space-between
}
.logo{
 font-size:23px;font-weight:900;color:#39ff88;
 text-shadow:0 0 12px #00ff66
}
.logo span{color:#fff}
.menu{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{
 border:1px solid #00ff6655;background:#07130b;color:#baffcc;
 padding:10px 13px;border-radius:8px;cursor:pointer;
 transition:.2s
}
button:hover,.btn:hover{
 background:#0b2916;border-color:#39ff88;
 box-shadow:0 0 14px #00ff6630
}
.hero{
 max-width:1250px;margin:auto;padding:48px 16px 25px;text-align:center
}
.hero h1{
 font-size:clamp(34px,7vw,70px);margin:0;color:#39ff88;
 text-shadow:0 0 25px #00ff6650
}
.hero p{color:#8fb99b;max-width:700px;margin:15px auto 25px;line-height:1.6}
.search{
 width:min(850px,100%);margin:auto;display:flex
}
.search input{
 flex:1;padding:16px;border-radius:10px 0 0 10px;
 border:1px solid #00ff6655;background:#061009;color:white;
 outline:none;font-size:16px
}
.search button{border-radius:0 10px 10px 0}
.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:10px;max-width:900px;margin:25px auto
}
.stat{
 padding:16px;border:1px solid #00ff6635;border-radius:12px;
 background:#061009
}
.stat b{display:block;color:#39ff88;font-size:23px}
.nav{
 max-width:1250px;margin:auto;padding:0 16px 15px;
 display:flex;gap:8px;overflow:auto
}
.nav button{white-space:nowrap}
main{max-width:1250px;margin:auto;padding:0 16px 50px}
.section-title{
 display:flex;justify-content:space-between;align-items:center;
 margin:25px 0 14px
}
.section-title h2{margin:0;color:#fff}
.section-title span{color:#55ff91;font-size:13px}
.grid{
 display:grid;grid-template-columns:repeat(4,1fr);gap:12px
}
.card{
 border:1px solid #00ff6630;background:#061009;
 border-radius:12px;padding:16px;min-height:145px;
 display:flex;flex-direction:column;justify-content:space-between;
 transition:.2s
}
.card:hover{
 transform:translateY(-3px);border-color:#39ff88;
 box-shadow:0 8px 30px #00ff6615
}
.card h3{margin:0 0 7px;color:#eaffef;font-size:16px}
.card p{margin:0;color:#789481;font-size:12px;line-height:1.45}
.card .actions{display:flex;gap:7px;margin-top:12px}
.card button{flex:1;padding:8px;font-size:12px}
.star{max-width:42px}
.empty{
 padding:40px;text-align:center;color:#799482;
 border:1px dashed #00ff6630;border-radius:12px
}
footer{
 border-top:1px solid #00ff6630;text-align:center;
 padding:30px;color:#698472
}
.modal{
 position:fixed;inset:0;background:#000b;display:none;
 align-items:center;justify-content:center;z-index:50;padding:15px
}
.modal.show{display:flex}
.box{
 width:min(700px,100%);max-height:90vh;overflow:auto;
 background:#061009;border:1px solid #39ff88;
 border-radius:15px;padding:20px;
 box-shadow:0 0 40px #00ff6630
}
.box-head{

 margin-bottom:15px

.box-head h2{margin:0;color:#39ff88}
.toolarea textarea,.toolarea input,.toolarea select{

 border:1px solid #00ff6645;border-radius:8px;outline:none
}
.toolarea textarea{min-height:180px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.result{

.small{font-size:11px;color:#789482}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}

 activeCat=c;document.getElementById("heading").textContent=c==="All"?"All Tools":c;

function render(){

 let arr=tools.map((t,i)=>({...t,i})).filter(t=>
  (activeCat==="All"||t[1]===activeCat) &&
  (!q||(t[0]+" "+t[1]+" "+t[2]).toLowerCase().includes(q))

 document.getElementById("count").textContent=arr.length+" tools";

 `<div class="empty" style="grid-column:1/-1">No tools found.</div>`;

}

  </div>

   <button class="star" onclick="toggleFav(${t.i})">${fav?"★":"☆"}</button>
  </div>

}

 if(favorites.includes(i))favorites=favorites.filter(x=>x!==i);
 else favorites.push(i);
 save();render();
}

/* TOOL UI */
function uiFor(n){

 "Coin Flip","Dice Roller","Yes or No","UUID Generator","PIN Generator","OTP Generator",
 "Current Date"].includes(n))

 return `<div class="row">
 <label>Length<input id="len" type="number" value="20" min="4" max="200"></label>
 <label>Count<input id="pc" type="number" value="1" min="1" max="20"></label>
 </div><button onclick="run('${esc(n)}')">GENERATE</button><div id="out" class="result"></div>`;

 if(n.includes("Image") || n==="Data URL Preview")
 return `<input id="file" type="file" accept="image/*" onchange="imageTool('${esc(n)}')">
 <div id="out" class="result">Select an image.</div>`;

 if(n==="CSS Color Picker")
 return `<input id="color" type="color" value="#39ff88" oninput="run('${esc(n)}')"><div id="out" class="result"></div>`;

 if(n.includes("Calculator")||n.includes("Checker")||n.includes("Solver")||
    n.includes("Percentage")||n.includes("Interest")||n.includes("BMI")||
    n.includes("Discount")||n.includes("Profit")||n.includes("Ratio"))
 return `<input id="a" placeholder="First value">
 <input id="b" placeholder="Second value">
 <input id="c" placeholder="Third value (optional)">
 <button onclick="run('${esc(n)}')">CALCULATE</button>
 <div id="out" class="result"></div>`;

 if(n.includes("→")||n.includes("Converter"))
 return `<input id="a" placeholder="Enter value">
 <button onclick="run('${esc(n)}')">CONVERT</button>
 <div id="out" class="result"></div>`;

 return `<textarea id="input" placeholder="Enter or paste text here..."></textarea>
 <div class="row">
  <button onclick="run('${esc(n)}')">RUN</button>
  <button onclick="copyOut()">COPY RESULT</button>
 </div>

}

/* MAIN TOOL ENGINE */
function run(n){
 const out=document.getElementById("out");
 const input=document.getElementById("input")?.value||"";
 const a=parseFloat(document.getElementById("a")?.value);
 const b=parseFloat(document.getElementById("b")?.value);
 const c=parseFloat(document.getElementById("c")?.value);

 let r="";

 try{
 switch(n){

 case "Text Case Converter":
  r=`UPPER:\n${input.toUpperCase()}\n\nLOWER:\n${input.toLowerCase()}\n\nTITLE:\n${titleCase(input)}`;break;
 case "Word Counter":
  r=`Words: ${words(input).length}\nCharacters: ${input.length}\nCharacters (no spaces): ${input.replace(/\s/g,"").length}`;break;
 case "Character Counter":r=input.length;break;
 case "Line Counter":r=input?input.split(/\r?\n/).length:0;break;
 case "Reverse Text":r=[...input].reverse().join("");break;
 case "Remove Duplicate Lines":r=[...new Set(input.split(/\r?\n/))].join("\n");break;
 case "Sort Lines A-Z":r=input.split(/\r?\n/).sort((x,y)=>x.localeCompare(y)).join("\n");break;
 case "Sort Lines Z-A":r=input.split(/\r?\n/).sort((x,y)=>y.localeCompare(x)).join("\n");break;
 case "Trim Lines":r=input.split(/\r?\n/).map(x=>x.trim()).join("\n");break;
 case "Remove Empty Lines":r=input.split(/\r?\n/).filter(x=>x.trim()).join("\n");break;

/* HELPERS */
function words(s){return s.trim()?s.trim().split(/\s+/):[]}
function titleCase(s){return s.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase())}
function cryptoRandom(n){
 const b=new Uint8Array(n);crypto.getRandomValues(b);
 return [...b].map(x=>x.toString(16).padStart(2,"0")).join("")
}
function randomDigits(n){return Array.from({length:n},()=>Math.floor(Math.random()*10)).join("")}
function factorial(n){if(n<0||n>170)return "Out of range";let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function isPrime(n){if(n<2)return false;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0)return false;return true}
function fib(n){let a=0,b=1,r=[];for(let i=0;i<n;i++){r.push(a);[a,b]=[b,a+b]}return r}
function norm(s){return [...s.toLowerCase().replace(/\W/g,"")].sort().join("")}
function freq(s){
 let m={};for(const c of s.replace(/\s/g,""))m[c]=(m[c]||0)+1;
 return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+" : "+x[1]).join("\n")
}
function roman(n){
 let v=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]],r="";
 for(const [x,s] of v)while(n>=x){r+=s;n-=x}return r||""
}
function numberWords(n){
 if(!Number.isFinite(n))return "";
 if(n===0)return"zero";
 if(n<0)return"minus "+numberWords(-n);
 const ones=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
 const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
 if(n<20)return ones[n];
 if(n<100)return tens[Math.floor(n/10)]+(n%10?"-"+ones[n%10]:"");
 if(n<1000)return ones[Math.floor(n/100)]+" hundred"+(n%100?" "+numberWords(n%100):"");
 if(n<1e6)return numberWords(Math.floor(n/1000))+" thousand"+(n%1000?" "+numberWords(n%1000):"");
 return n.toLocaleString();
}
function csvJson(s){
 const lines=s.trim().split(/\r?\n/);const h=lines.shift().split(",");
 return JSON.stringify(lines.map(l=>{let v=l.split(",");return Object.fromEntries(h.map((x,i)=>[x.trim(),(v[i]||"").trim()]))}),null,2)
}
function jsonCsv(s){
 let a=JSON.parse(s);if(!Array.isArray(a))a=[a];let h=[...new Set(a.flatMap(x=>Object.keys(x)))];
 return [h.join(","),...a.map(x=>h.map(k=>JSON.stringify(x[k]??"")).join(","))].join("\n")
}
function httpStatus(n){
 const m={200:"OK",201:"Created",204:"No Content",301:"Moved Permanently",302:"Found",304:"Not Modified",400:"Bad Request",401:"Unauthorized",403:"Forbidden",404:"Not Found",429:"Too Many Requests",500:"Internal Server Error",502:"Bad Gateway",503:"Service Unavailable"};
 return m[n]||"Unknown status"
}
function cleanURL(s){
 try{
  let u=new URL(s);["utm_source","utm_medium","utm_campaign","utm_term","utm_content","fbclid","gclid"].forEach(k=>u.searchParams.delete(k));
  return u.toString()
 }catch{return "Invalid URL"}
}
function hexRgb(h){
 h=h.replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");
 let n=parseInt(h,16);return `rgb(${n>>16&255}, ${(n>>8)&255}, ${n&255})`
}
function rgbHex(r,g,b){return "#"+[r,g,b].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("").toUpperCase()}
function rgbHsl(r,g,b){
 r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;
 if(max===min)h=s=0;else{let d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h/=6}
 return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`
}
function hslRgb(h,s,l){
 h/=360;s/=100;l/=100;
 let f=n=>{let k=(n+h*12)%12;return l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1))};
 return `rgb(${Math.round(f(0)*255)}, ${Math.round(f(8)*255)}, ${Math.round(f(4)*255)})`
}
function mixColors(a,b){
 const x=hexRgb(a).match(/\d+/g).map(Number),y=hexRgb(b).match(/\d+/g).map(Number);
 return rgbHex(...x.map((v,i)=>Math.round((v+y[i])/2)))
}
function passwordStrength(s){
 let score=0;if(s.length>=8)score++;if(s.length>=12)score++;if(/[a-z]/.test(s))score++;if(/[A-Z]/.test(s))score++;if(/\d/.test(s))score++;if(/[^\w]/.test(s))score++;
 return `Score: ${score}/6\n${score>=5?"STRONG":score>=3?"MEDIUM":"WEAK"}`
}
async function awaitHash(text,alg){
 const buf=await crypto.subtle.digest(alg,new TextEncoder().encode(text));
 const h=[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("");
 document.getElementById("out").textContent=h;return h
}
function copyOut(){
 navigator.clipboard?.writeText(document.getElementById("out").textContent||"");
}
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,"&quot;")}
function escAttr(s){return String(s).replace(/"/g,"&quot;")}
function imageTool(n){
 const f=document.getElementById("file").files[0],out=document.getElementById("out");
 if(!f)return;
 if(n==="Image File Info"){
  const im=new Image();im.onload=()=>out.textContent=`Name: ${f.name}\nType: ${f.type}\nSize: ${f.size} bytes\nDimensions: ${im.width} × ${im.height}`;im.src=URL.createObjectURL(f)
 }else{
  const reader=new FileReader();reader.onload=()=>out.textContent=reader.result;reader.readAsDataURL(f)
 }
}
